name: Sync leads to Salesforce

# Every 15 minutes, plus a button for when someone has just fixed the org and
# does not want to wait.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Retry failed Salesforce writes
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.SYNC_SECRET }}" \
            "${{ secrets.APP_URL }}/api/sync"
